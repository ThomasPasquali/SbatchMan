# Include configurations and jobs common variables
include:
  - variables.yaml
  - subdir/more_variables.yaml

# This variables block will add new declarations
variables:
  # Define a map (cluster name)-> [available partitions] 
  partition:
    per_cluster:
      clusterA: ["partition_A1", "partition_A2"]
      clusterB: ["partition_B"]

  # Define a map (partition)-> (qos) 
  qos:
    map:
      partition_A1: 'regular1'
      partition_A2: 'regular2'
      partition_B: 'regular'

  task_cpus: [1, 4, 8]

  to_override1: 'OVERWRITTEN'

  # Override nodes to include clusterC
  nodes:
    per_cluster:
      clusterA: [1]
      clusterB: [1, 2]
      clusterC: [1]

clusters:
  # The cluster names will be set during SbatchMan installation
  clusterA:
    scheduler: Slurm

    # Values set here will be set on every `clusterA` configuration
    params:
      nodes: "{{nodes}}"
      account: "example_account"
      mem: "16G"
      time: "01:00:00"
      partition: "{{partition}}"
      qos: "{{qos[partition]}}"
      cpus_per_task: "{{task_cpus}}"
      env:
        # This will override the default CUSTOM_VAR value
        CUSTOM_VAR: "new_value"
        ANOTHER_VAR: "only_for_clusterA"

    configs:
      - name: "config_{{nodes}}-N_{{task_cpus}}-CPU_{{partition}}"

      - name: "budget_{{nodes}}-N_{{task_cpus}}-CPU_{{partition}}"
        params:
          time: "00:05:00"

  clusterB:
    scheduler: Pbs
    configs:
      - name: "weird_but_plausible_{{nodes}}-N_{{task_cpus}}-CPU"
        params:
          cpus: "{{task_cpus}}"
          walltime: "01:00:00"
          env:
            OMP_NUM_THREADS: "{{task_cpus}}_{{nodes}}"

  clusterC:
    scheduler: Local

    configs:
      - name: "config_{{nodes}}-N_{{task_cpus}}-CPU"
        params:
          env:
            OMP_NUM_THREADS: "{{task_cpus}}_{{nodes}}"
